<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byfu Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="window-controls">
      <button class="mac-btn close" id="closeBtn" title="Close"></button>
      <button class="mac-btn maximize" id="maxBtn" title="Maximize to Full Screen"></button>
    </div>

    <div class="header">
      <div class="logo">
        <img src="img/logo.png" alt="Logo" class="custom-logo">
        <div class="logo-text">
          <img src="img/byfu.png" alt="Byfu" class="custom-logo-text">
        </div>
      </div>
      <div class="status-indicator" id="statusIndicator">
        <div class="status-dot"></div>
        <span id="statusText">Active</span>
      </div>
    </div>
    
    <div class="tabs">
      <button class="tab-btn active" id="tabMain">Shield</button>
      <button class="tab-btn" id="tabLog">Logs</button>
    </div>
    
    <div id="mainView" class="view active">
      <div class="card">
        <div class="info">
          <h3>Anti-Detect Filter</h3>
          <p>Masks fingerprinting vectors dynamically.</p>
        </div>
        <div class="toggle-container">
          <label class="switch">
            <input type="checkbox" id="toggleSwitch">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div id="logView" class="view">
      <div class="log-header">
        <h3>Activity Log</h3>
        <button id="clearLogBtn" class="clear-btn">Clear</button>
      </div>
      <div class="log-content" id="logContent">
        <div class="log-empty">Loading logs...</div>
      </div>
    </div>

    <div class="footer">
      <p>Version 6.0.0 • by evilst</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
